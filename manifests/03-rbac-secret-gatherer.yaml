apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multi-namespace-secret-reader
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Insights
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
      - "list"
---
# Binding for openshift-monitoring namespace to read alertmanager-main
# gather_alertmanager_config.go
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-secrets-binding
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Insights
  namespace: openshift-monitoring
subjects:
  - kind: ServiceAccount
    namespace: openshift-insights
    name: gather
roleRef:
  kind: ClusterRole
  name: multi-namespace-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
# Binding for openshift-config namespace to read support secret
# gather_support_secret.go
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-secrets-binding
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Insights
  namespace: openshift-config
subjects:
  - kind: ServiceAccount
    namespace: openshift-insights
    name: gather
roleRef:
  kind: ClusterRole
  name: multi-namespace-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
# Binding for openshift-ingress-operator namespace to read router-ca secret
# gather_cluster_ingress_certificates.go
apiVersion: rbac.authorization.k8s.io/v1
