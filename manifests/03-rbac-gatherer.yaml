apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: insights-operator-gather
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Insights
rules:
  - apiGroups:
      - "nfd.k8s-sigs.io"
    resources:
      - nodefeatures
    verbs:
      - list
  - apiGroups:
      - "monitoring.coreos.com"
    resources:
      - alertmanagers
      - prometheuses
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - list
  - apiGroups:
      - imageregistry.operator.openshift.io
    resources:
      - configs
      - imagepruners
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - proxy
  - apiGroups:
      - ""
    resources:
      - nodes/log
      - nodes/metrics
      - nodes/proxy
      - nodes/stats
    verbs:
      - get
  - apiGroups:
      - config.openshift.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - machine.openshift.io
    resources:
      - machinesets
      - controlplanemachineset
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - operator.openshift.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - core.openstack.org
    resources:
      - "*"
    verbs:
      - get
      - list
  - apiGroups:
      - dataplane.openstack.org
    resources:
      - "*"
    verbs:
      - get
      - list
  - apiGroups:
      - installers.datahub.sap.com
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - operators.coreos.com
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - controlplane.operator.openshift.io
    resources:
      - podnetworkconnectivitychecks
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - machineconfiguration.openshift.io
    resources:
      - machineconfigs
      - kubeletconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - logging.openshift.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiserver.openshift.io
    resources:
      - apirequestcounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - jaegertracing.io
    resources:
      - jaegers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - costmanagement-metrics-cfg.openshift.io
    resources:
      - costmanagementmetricsconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ocs.openshift.io
    resources:
      - storageclusters
    verbs:
      - get
      - list
  - apiGroups:
      - ceph.rook.io
    resources:
      - cephclusters
    verbs:
      - get
      - list
  - apiGroups:
      - nmstate.io
    resources:
      - nodenetworkconfigurationpolicies
      - nodenetworkstates
    verbs:
      - get
      - list
  - apiGroups:
      - loki.grafana.com
    resources:
      - lokistacks
    verbs:
      - get
      - list
  - apiGroups:
      - ingress.operator.openshift.io
    resources:
      - dnsrecords
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - network.operator.openshift.io
    resources:
      - operatorpkis
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - opentelemetry.io
    resources:
      - opentelemetrycollectors
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: insights-operator-gather
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Insights
roleRef:
  kind: ClusterRole
  name: insights-operator-gather
subjects:
  - kind: ServiceAccount
    namespace: openshift-insights
    name: gather
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: insights-operator-gather-reader
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Insights
roleRef:
  kind: ClusterRole
  name: cluster-reader
subjects:
  - kind: ServiceAccount
    namespace: openshift-insights
    name: gather
